<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club — Global BookShelf</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="api.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --text-rgb:245,239,227;
  --ink-rgb:7,7,16;

  --ink:#070710;--ink2:#0f0f1a;--ink3:#171724;--ink4:#1f1f2e;--ink5:#282838;
  --pg:#f3ecde;--pg2:#ebe1ce;--pg3:rgba(243,236,222,.68);--pg4:rgba(243,236,222,.35);--pg5:rgba(243,236,222,.11);--pg6:rgba(243,236,222,.05);
  --gold:#c5a038;--gold2:#e3be50;--goldd:rgba(197,160,56,.15);--goldb:rgba(197,160,56,.28);
  --teal:#32aea6;--teald:rgba(50,174,166,.13);
  --coral:#da5238;--corald:rgba(218,82,56,.12);
  --violet:#8470d0;--violetd:rgba(132,112,208,.12);
  --sage:#64a472;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',sans-serif;
  --r:10px;--rs:6px;
}

/* ── READING ROOM — daylight parchment theme ── */
[data-theme="day"]{
  --text-rgb:43,33,24;
  /* text-color families used across pages */
  --parchment:#2b2118;--parchment2:#3a2e22;--parchment3:rgba(43,33,24,.7);
  --muted:rgba(43,33,24,.58);--muted2:rgba(43,33,24,.3);--muted3:rgba(43,33,24,.18);
  --paper:#f7f3e9;--text:#2b2118;
  --amber:#a85f1e;

  --ink:#f7f3e9;--ink2:#fffdf7;--ink3:#f1ebdc;--ink4:#e8e0cd;--ink5:#ddd3bc;
  --pg:#2b2118;--pg2:#3a2e22;--pg3:rgba(43,33,24,.72);--pg4:rgba(43,33,24,.48);--pg5:rgba(43,33,24,.13);--pg6:rgba(43,33,24,.09);
  --gold:#9a7b2f;--gold2:#836722;--goldd:rgba(154,123,47,.13);--goldb:rgba(154,123,47,.32);
  --teal:#1d7d76;--teald:rgba(29,125,118,.12);
  --coral:#b83d24;--corald:rgba(184,61,36,.11);
  --violet:#5f4bb0;--violetd:rgba(95,75,176,.11);
  --sage:#3f7d51;
  --ink-rgb:247,243,233;
  --paper:#f7f3e9;--muted:rgba(43,33,24,.55);--text:#2b2118;
}
html,body{transition:background .35s ease,color .35s ease}
.theme-toggle{background:none;border:1px solid var(--pg5,rgba(128,128,128,.25));color:var(--pg3,#888);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .2s;flex-shrink:0;padding:0;line-height:1}
.theme-toggle:hover{border-color:var(--goldb,rgba(197,160,56,.4));color:var(--gold,#c5a038);transform:rotate(-12deg)}

html,body{width:100%;min-height:100%;background:var(--ink);color:var(--pg);font-family:var(--sans)}
a{color:inherit;text-decoration:none}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--pg5);position:sticky;top:0;background:var(--ink);backdrop-filter:blur(12px);z-index:100}
.nav-logo{font-family:var(--serif);font-size:22px;font-weight:500}
.nav-logo em{color:var(--gold);font-style:italic}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{font-size:13px;color:var(--pg3);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--pg)}
.btn-gold{padding:8px 18px;border:1px solid var(--gold);border-radius:var(--rs);background:var(--gold);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .2s}
.btn-gold:hover{background:var(--gold2)}

.wrap{max-width:1100px;margin:0 auto;padding:28px 40px 80px}
.back-link{font-size:12px;color:var(--pg4);margin-bottom:20px;display:inline-block;transition:color .2s}
.back-link:hover{color:var(--gold)}

/* CLUB HEADER */
.club-header{border-radius:var(--r);overflow:hidden;border:1px solid var(--pg5);margin-bottom:24px;background:var(--ink2)}
.club-banner{height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.club-banner-emoji{font-size:52px;position:relative;z-index:1}
.banner-upload-btn{position:absolute;bottom:10px;right:12px;z-index:2;padding:7px 14px;background:rgba(var(--ink-rgb), .75);border:1px solid rgba(243,236,222,.25);border-radius:var(--rs);color:var(--pg);font-size:12px;font-family:var(--sans);cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
.banner-upload-btn:hover{background:rgba(var(--ink-rgb), .9);border-color:var(--gold)}
/* AVATAR — upload lives entirely here, no buttons */
.club-avatar-wrap{position:relative;width:96px;height:96px;margin:-52px 0 0 26px;z-index:3}
.club-avatar-wrap.editable{cursor:pointer}
.club-avatar{width:96px;height:96px;border-radius:50%;position:relative;border:4px solid var(--ink2);background:var(--ink3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:40px;overflow:hidden;z-index:1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.club-avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* quiet rotating hint ring — only when empty & you're the owner */
.club-avatar-wrap.editable.empty::before{content:'';position:absolute;inset:-3px;border-radius:50%;padding:2px;background:conic-gradient(from 0deg,transparent 0 58%,var(--gold2) 74%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ringspin 4.5s linear infinite;z-index:0;pointer-events:none}
@keyframes ringspin{to{transform:rotate(360deg)}}
/* soft veil revealed on hover / while uploading */
.avatar-veil{position:absolute;inset:0;border-radius:50%;background:rgba(var(--ink-rgb), .58);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;opacity:0;transition:opacity .25s;z-index:5}
.avatar-veil svg{width:19px;height:19px;stroke:var(--pg);fill:none;stroke-width:1.4;stroke-linejoin:round}
.avatar-veil span{font-family:var(--sans);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--pg2)}
.club-avatar-wrap.editable:hover .avatar-veil,.club-avatar-wrap.uploading .avatar-veil{opacity:1}
.club-avatar-wrap.uploading .avatar-veil svg{animation:veilpulse 1s ease-in-out infinite}
@keyframes veilpulse{0%,100%{opacity:.35}50%{opacity:1}}
.club-header-body{padding:12px 26px 22px}
.club-name{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.1;margin-bottom:8px}
.club-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--pg4);margin-bottom:14px}
.club-meta strong{color:var(--pg3);font-weight:500}
.club-desc{font-size:14px;color:var(--pg3);line-height:1.6;max-width:640px;margin-bottom:18px}
.club-actions{display:flex;gap:10px}
.join-btn{padding:11px 26px;background:var(--gold);border:none;border-radius:var(--rs);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .2s}
.join-btn:hover{background:var(--gold2)}
.join-btn:disabled{background:var(--sage);cursor:default;opacity:.85}
.share-btn{padding:11px 22px;background:transparent;border:1px solid var(--pg5);border-radius:var(--rs);color:var(--pg);font-size:13px;cursor:pointer;font-family:var(--sans);transition:all .2s}
.share-btn:hover{border-color:var(--gold)}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

.card{background:var(--ink2);border:1px solid var(--pg5);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--pg5);display:flex;align-items:center;justify-content:space-between}
.card-t{font-family:var(--serif);font-size:19px;font-weight:500}
.card-b{padding:20px}

/* CURRENT BOOK */
.current-book{display:flex;gap:16px;align-items:center}
.cb-cover{width:64px;height:92px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:9px;color:var(--pg);padding:6px;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.cb-info-title{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.cb-info-author{font-size:12px;color:var(--pg4);margin-bottom:8px}
.cb-link{font-size:12px;color:var(--gold);cursor:pointer}
.cb-link:hover{text-decoration:underline}

/* POST BOX */
.post-box{margin-bottom:22px}
.post-input{width:100%;padding:13px;background:var(--ink3);border:1px solid var(--pg5);border-radius:var(--rs);color:var(--pg);font-family:var(--sans);font-size:13px;resize:vertical;min-height:70px;outline:none;transition:border-color .2s}
.post-input:focus{border-color:var(--goldb)}
.post-actions{display:flex;justify-content:flex-end;margin-top:10px}
.post-submit{padding:9px 22px;background:var(--gold);border:none;border-radius:var(--rs);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .2s}
.post-submit:hover{background:var(--gold2)}
.post-submit:disabled{opacity:.5;cursor:default}

/* POST FEED */
.post{padding:16px 0;border-bottom:1px solid var(--pg6)}
.post:last-child{border-bottom:none}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post-avatar{width:34px;height:34px;border-radius:50%;background:var(--goldd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--gold);flex-shrink:0;overflow:hidden}
.post-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.post-author{font-size:13px;font-weight:500;color:var(--pg2)}
.post-time{font-size:11px;color:var(--pg4)}
.post-topic{display:inline-block;font-size:10px;color:var(--violet);background:var(--violetd);border:1px solid rgba(132,112,208,.3);border-radius:20px;padding:2px 9px;margin-left:6px}
.post-body{font-size:13px;color:var(--pg3);line-height:1.6;padding-left:44px}
.empty{text-align:center;padding:40px 20px;color:var(--pg4);font-size:13px}
.empty-emoji{font-size:32px;margin-bottom:10px;opacity:.6}

/* MEMBERS — the reading circle */
.members-countries{font-size:11px;color:var(--pg4);padding:0 0 14px;margin-bottom:6px;border-bottom:1px solid var(--pg6);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.members-countries .flags{display:inline-flex;align-items:center;gap:4px}
.members-countries .flag-img{width:20px;height:14px}
/* flag images render the same on every OS (Windows has no emoji flags) */
.flag-img{display:inline-block;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.post-time .flag-img{width:16px;height:11px;vertical-align:-1px;margin-left:1px}
.member{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--pg6)}
.member:last-child{border-bottom:none}
.member-av{position:relative;width:34px;height:34px;flex-shrink:0}
.member-avatar{width:34px;height:34px;border-radius:50%;background:var(--teald);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--teal);overflow:hidden}
.member-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-flag{position:absolute;bottom:-3px;right:-4px;width:17px;height:12px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 2px var(--ink2),0 1px 3px rgba(0,0,0,.6)}
.member-flag .flag-img{width:100%;height:100%;display:block;border-radius:0;box-shadow:none}
.member-av.me{cursor:pointer}
.member-veil{position:absolute;inset:0;border-radius:50%;background:rgba(var(--ink-rgb), .55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:3}
.member-veil svg{width:14px;height:14px;stroke:var(--pg);fill:none;stroke-width:1.5;stroke-linejoin:round}
.member-av.me:hover .member-veil,.member-av.me.uploading .member-veil{opacity:1}
.member-av.me.uploading .member-veil svg{animation:veilpulse 1s ease-in-out infinite}
.member-name{font-size:13px;color:var(--pg2);display:flex;align-items:center}
.member-you{font-size:9px;color:var(--teal);border:1px solid var(--teald);border-radius:20px;padding:1px 6px;margin-left:6px;letter-spacing:.04em}
.member-role{font-size:10px;color:var(--gold);margin-left:auto;text-transform:uppercase;letter-spacing:.05em}

.loading{text-align:center;padding:40px;color:var(--pg4);font-size:13px}

/* toast */
.gbs-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink4);border:1px solid var(--goldb);border-radius:8px;padding:12px 22px;font-size:13px;color:var(--pg);z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* GBS-MOBILE-FIXES — small screens */
@media (max-width: 900px){
  .filter-strip{
    position: fixed !important;
    right: auto !important;
    left: 0 !important;
    top: auto !important;
    bottom: 84px !important;
    transform: none !important;
    width: 100% !important;
    flex-direction: row !important;
    gap: 8px !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    padding: 6px 14px 8px !important;
    z-index: 45 !important;
    scrollbar-width: none;
    -ms-overflow-style: none;
    justify-content: flex-start !important;
    align-items: center !important;
    mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .filter-strip::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex: 0 0 auto !important;
    scroll-snap-align: center;
    font-size: 12px !important;
    padding: 8px 14px !important;
  }

  .time-slider-wrap{ left: 12px !important; right: auto !important; }

  .hero-title{ font-size: clamp(30px, 9vw, 48px) !important; }
  .hero-sub{ font-size: 13px !important; padding: 0 20px; }
  .hero-content{ bottom: 150px !important; }
  .hero-eyebrow{ font-size: 9px !important; letter-spacing: .18em !important; }

  .search-wrap{ width: min(88vw, 360px) !important; top: 70px !important; }

  nav{ padding: 12px 16px !important; flex-wrap: wrap !important; gap: 8px; }
  .nav-links{ order: 3; width: 100%; justify-content: center; flex-wrap: wrap; gap: 14px !important; }

  .stats-bar{ overflow-x: auto !important; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .stats-bar::-webkit-scrollbar{ display:none; }

  html, body{ max-width: 100%; overflow-x: hidden; }
}

@media (max-width: 560px){
  .hero-content{ bottom: 140px !important; }
  .filter-strip{ bottom: 76px !important; }
  .search-wrap{ top: 64px !important; }
}


/* GBS-MOBILE-FIX2 — keep chips clear of hero buttons */
@media (max-width: 900px){
  .filter-strip{
    bottom: 0 !important;
    padding: 10px 14px 12px !important;
    background: linear-gradient(to top,
      rgba(var(--ink-rgb,7,7,16),0.94),
      rgba(var(--ink-rgb,7,7,16),0.75) 62%,
      rgba(var(--ink-rgb,7,7,16),0)) !important;
    z-index: 60 !important;
  }
  .hero-content{ bottom: 104px !important; }
  .scroll-hint{ display: none !important; }
  .stats-bar{ padding-bottom: 58px !important; }
}
@media (max-width: 560px){
  .hero-content{ bottom: 98px !important; }
  .filter-strip{ padding: 9px 12px 11px !important; }
  .hero-actions{ flex-wrap: wrap; gap: 10px !important; }
}


/* GBS-CHIPS-SLIDE — chips slide away instead of covering content */
@media (max-width: 900px){
  .filter-strip{
    transition: transform .28s ease, opacity .28s ease !important;
    will-change: transform;
  }
  .filter-strip.chips-hidden{
    transform: translateY(115%) !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  /* small pull tab so the strip can always be brought back */
  .chips-tab{
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    z-index: 61;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 14px 7px;
    border-radius: 12px 12px 0 0;
    border: 1px solid var(--goldb, rgba(201,168,76,.3));
    border-bottom: none;
    background: rgba(var(--ink-rgb,7,7,16), .92);
    color: var(--gold, #c5a038);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-family: var(--sans, sans-serif);
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .chips-tab.show{ display: inline-flex; }
}
@media (min-width: 901px){
  .chips-tab{ display: none !important; }
}


/* GBS-HEADER-FIX — phone header layout */
@media (max-width: 900px){
  nav{
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    row-gap: 6px !important;
    column-gap: 8px !important;
    padding: 10px 12px 6px !important;
  }

  /* row 1: logo on the left, actions on the right */
  .nav-logo{ order: 1; flex: 1 1 auto; min-width: 0; }
  .nav-logo-text{ font-size: 17px !important; white-space: nowrap; }
  .nav-actions{
    order: 2;
    flex: 0 0 auto;
    display: flex !important;
    align-items: center !important;
    gap: 7px !important;
  }
  .nav-actions .btn-ghost,
  .nav-actions .btn-primary{
    padding: 7px 11px !important;
    font-size: 11px !important;
    white-space: nowrap !important;
  }
  .theme-toggle{
    order: 2;
    width: 30px !important;
    height: 30px !important;
    font-size: 13px !important;
  }

  /* row 2: nav links, swipeable sideways */
  .nav-links{
    order: 3 !important;
    flex: 0 0 100% !important;
    width: 100% !important;
    display: flex !important;
    flex-wrap: nowrap !important;
    justify-content: flex-start !important;
    gap: 18px !important;
    margin: 0 !important;
    padding: 4px 2px 6px !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .nav-links::-webkit-scrollbar{ display: none; }
  .nav-links li{ flex: 0 0 auto !important; }
  .nav-links a{ font-size: 13px !important; white-space: nowrap !important; }

  /* search bar sits BELOW the whole header instead of over it */
  .search-wrap{
    position: absolute !important;
    top: 118px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: min(90vw, 380px) !important;
    z-index: 25 !important;
  }

  /* hero text starts under the search bar */
  .hero-content{ padding-top: 0 !important; }
  .hero-eyebrow{ margin-top: 8px !important; }
}

@media (max-width: 560px){
  .nav-logo-mark{ width: 30px !important; height: 30px !important; font-size: 15px !important; }
  .nav-logo-text{ font-size: 15px !important; }
  .nav-actions .btn-ghost,
  .nav-actions .btn-primary{ padding: 6px 9px !important; font-size: 10.5px !important; }
  .nav-links{ gap: 15px !important; }
  .nav-links a{ font-size: 12.5px !important; }
  .search-wrap{ top: 112px !important; }
}


/* GBS-LIFT-BUTTONS — hero buttons clear of the bottom chip strip */
@media (max-width: 900px){
  .hero-content{
    bottom: auto !important;
    top: 46% !important;
    transform: translateY(-42%) !important;
    padding-bottom: 0 !important;
  }
  .hero-actions{
    margin-top: 18px !important;
    flex-wrap: wrap !important;
    gap: 12px !important;
    row-gap: 10px !important;
  }
  /* chips keep to the very bottom edge */
  .filter-strip{ bottom: 0 !important; }
  /* the decorative scroll cue sat right between them */
  .scroll-hint{ display: none !important; }
}

@media (max-width: 560px){
  .hero-content{ top: 44% !important; transform: translateY(-40%) !important; }
  .hero-actions{ margin-top: 14px !important; }
  .hero-actions .btn-primary,
  .hero-actions .btn-ghost{ padding: 11px 18px !important; font-size: 12px !important; }
}

/* very short screens: shrink type rather than let things collide */
@media (max-width: 900px) and (max-height: 700px){
  .hero-title{ font-size: clamp(26px, 7.5vw, 38px) !important; }
  .hero-sub{ font-size: 12px !important; }
  .hero-content{ top: 42% !important; }
}


/* GBS-CHIPS-HERO-ONLY — chip strip lives with the hero only */
@media (max-width: 900px){
  .filter-strip{
    transition: opacity .25s ease, transform .25s ease, visibility .25s ease !important;
  }
  .filter-strip.chips-off{
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(115%) !important;
    pointer-events: none !important;
  }
  /* the pull tab must never linger past the hero either */
  .chips-tab.chips-off{
    opacity: 0 !important;
    visibility: hidden !important;

<script>
// Reading light — applied before paint so there is no flash
(function(){
  var t = 'night';
  try { t = localStorage.getItem('gbs-theme') || 'night'; } catch(e){}
  if (t === 'day') document.documentElement.setAttribute('data-theme','day');
})();
function toggleTheme(){
  var el = document.documentElement;
  var isDay = el.getAttribute('data-theme') === 'day';
  if (isDay) el.removeAttribute('data-theme');
  else el.setAttribute('data-theme','day');
  try { localStorage.setItem('gbs-theme', isDay ? 'night' : 'day'); } catch(e){}
  syncThemeIcon();
}
function syncThemeIcon(){
  var isDay = document.documentElement.getAttribute('data-theme') === 'day';
  document.querySelectorAll('.theme-toggle').forEach(function(b){
    b.textContent = isDay ? '\u2600' : '\u263E';
    b.title = isDay ? 'Reading Room \u2014 switch to Night Library'
                    : 'Night Library \u2014 switch to Reading Room';
  });
}
document.addEventListener('DOMContentLoaded', syncThemeIcon);
</script>

<body>

<nav>
  <a href="global-bookshelf.html" class="nav-logo">Global <em>BookShelf</em></a>
  <ul class="nav-links">
    <li><a href="global-bookshelf.html">Explore</a></li>
    <li><a href="author-universe.html">Authors</a></li>
    <li><a href="community-hub.html" class="active">Communities</a></li>

  </ul>
  <button class="btn-gold" onclick="window.location.href='community-hub.html'">All clubs</button>
  <button class="theme-toggle" onclick="toggleTheme()" title="Switch reading light" aria-label="Switch theme">☾</button>
</nav>

<div class="wrap">
  <a href="community-hub.html" class="back-link">← Back to communities</a>

  <div id="clubContent">
    <div class="loading">Loading club…</div>
  </div>
</div>

<script>
// Get club ID from URL
const params = new URLSearchParams(window.location.search);
const clubId = params.get('id');

// Color palette for banners/covers
const PALETTE = [
  { c1:'#8B3A2A', c2:'#C25040' },
  { c1:'#2A5A8B', c2:'#4080C2' },
  { c1:'#5A2A8B', c2:'#7E40C2' },
  { c1:'#2A6B3A', c2:'#40A058' },
  { c1:'#8B6B2A', c2:'#C29840' },
];
function hashColor(str) {
  let h = 0;
  for (let i = 0; i < (str||'').length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}
function pickEmoji(str){ let h=0; for(let i=0;i<(str||'').length;i++) h=str.charCodeAt(i)+((h<<5)-h); return ['📚','🌙','📖','🌿','🌍','🕯','📜','☕','🖋','🌸'][Math.abs(h)%10]; }

function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function timeAgo(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr), now = new Date();
  const s = Math.floor((now-d)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString();
}

let clubData = null;
let isMember = false;
let isOwner  = false;
let currentUserId = null;
let myAvatarUrl   = null;

// ISO 3166-1 alpha-2 country code → flag image (renders identically on every device)
function flagEmoji(cc){
  if(!cc || cc.length !== 2) return '';
  const low = cc.toLowerCase();
  if(!/^[a-z]{2}$/.test(low)) return '';
  return `<img class="flag-img" src="https://flagcdn.com/${low}.svg" alt="${cc.toUpperCase()}" loading="lazy">`;
}

async function loadClub() {
  if (!clubId) {
    document.getElementById('clubContent').innerHTML =
      '<div class="empty"><div class="empty-emoji">🔍</div>No club specified. <a href="community-hub.html" style="color:var(--gold)">Browse clubs →</a></div>';
    return;
  }

  try {
    const [clubRes, postsRes, membersRes] = await Promise.all([
      API.get('/api/clubs/' + clubId),
      API.get('/api/clubs/' + clubId + '/posts'),
      API.get('/api/clubs/' + clubId + '/members'),
    ]);

    clubData = clubRes.club;
    isMember = clubRes.is_member || false;
    const session = API.getSession();
    const uid = session?.user?.id;
    currentUserId = uid || null;
    myAvatarUrl   = session?.user?.avatar_url || null;
    isOwner = !!uid && (clubData.owner_id === uid || clubData.created_by === uid || clubData.creator_id === uid);
    const posts   = postsRes.posts || [];
    const members = membersRes.members || [];

    if (!clubData) throw new Error('Club not found');

    document.title = clubData.name + ' — Global BookShelf';
    render(clubData, posts, members);

  } catch (e) {
    document.getElementById('clubContent').innerHTML =
      '<div class="empty"><div class="empty-emoji">😕</div>' + (e.message || 'Could not load this club') +
      '<br><a href="community-hub.html" style="color:var(--gold);margin-top:10px;display:inline-block">← Back to communities</a></div>';
  }
}

function render(club, posts, members) {
  const pal   = hashColor(club.name);
  const emoji = pickEmoji(club.name);
  const langNames = { en:'English', sw:'Swahili', fr:'French', ar:'Arabic', pt:'Portuguese', es:'Spanish', yo:'Yorùbá', ha:'Hausa' };
  const lang  = langNames[club.language] || club.language || 'English';
  const countries = [...new Set(members.map(m => m.country_code).filter(Boolean))];

  document.getElementById('clubContent').innerHTML = `
    <!-- HEADER -->
    <div class="club-header">
      <div class="club-banner" id="clubBanner" style="${club.image_url
        ? `background:url('${club.image_url}') center/cover no-repeat`
        : `background:linear-gradient(135deg, ${pal.c1}, ${pal.c2})`}">
        ${club.image_url ? '' : `<span class="club-banner-emoji">${emoji}</span>`}
      </div>
      <div class="club-avatar-wrap ${isOwner ? 'editable' : ''} ${club.image_url ? '' : 'empty'}" id="clubAvatarWrap"
        ${isOwner ? `onclick="document.getElementById('clubImageInput').click()" title="Upload club image"` : ''}>
        <div class="club-avatar" id="clubAvatar">
          ${club.image_url
            ? `<img src="${club.image_url}" alt="${club.name}">`
            : `<span>${emoji}</span>`}
          ${isOwner ? `
            <div class="avatar-veil">
              <svg viewBox="0 0 24 24"><path d="M4 8h3l1.4-2h7.2L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>
              <span>${club.image_url ? 'Change' : 'Add'}</span>
            </div>` : ''}
        </div>
      </div>
      ${isOwner ? `<input type="file" id="clubImageInput" accept="image/*" style="display:none" onchange="uploadClubImage(this)">` : ''}
      <div class="club-header-body">
        <div class="club-name">${club.name}</div>
        <div class="club-meta">
          <span><strong>${(club.member_count||0).toLocaleString()}</strong> members</span>
          <span>${lang}</span>
          <span>${club.visibility === 'public' ? '🌍 Public' : '🔒 Private'} club</span>
        </div>
        <div class="club-desc">${club.description || 'A community of readers exploring books together.'}</div>
        <div class="club-actions">
          <button class="join-btn" id="joinBtn" onclick="handleJoin()">${isMember ? '✓ Member' : 'Join this club'}</button>
          <button class="share-btn" onclick="shareClub()">Share</button>
        </div>
      </div>
    </div>

    <div class="layout">
      <!-- MAIN: DISCUSSION -->
      <div class="main-col">
        <div class="card">
          <div class="card-h"><div class="card-t">Discussion</div></div>
          <div class="card-b">
            <div class="post-box">
              <textarea class="post-input" id="postInput" placeholder="${isMember ? 'Share a thought with the club…' : 'Join the club to post…'}" ${isMember ? '' : 'disabled'}></textarea>
              <div class="post-actions">
                <button class="post-submit" id="postSubmit" onclick="submitPost()" ${isMember ? '' : 'disabled'}>Post →</button>
              </div>
            </div>
            <div id="postFeed">
              ${posts.length === 0
                ? '<div class="empty"><div class="empty-emoji">💬</div>No posts yet. Start the conversation!</div>'
                : posts.map(renderPost).join('')}
            </div>
          </div>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div class="side-col">
        <div class="card">
          <div class="card-h"><div class="card-t">Members</div></div>
          <div class="card-b">
            ${countries.length ? `
              <div class="members-countries">
                <span class="flags">${countries.map(flagEmoji).join(' ')}</span>
                <span>Readers from ${countries.length} ${countries.length === 1 ? 'country' : 'countries'}</span>
              </div>` : ''}
            ${members.length === 0
              ? '<div class="empty" style="padding:20px"><div class="empty-emoji">👥</div>No members yet</div>'
              : members.map(renderMember).join('')}
          </div>
        </div>
      </div>
    </div>
    ${API.isLoggedIn() ? `<input type="file" id="memberAvatarInput" accept="image/*" style="display:none" onchange="uploadMemberAvatar(this)">` : ''}
  `;
}

function renderPost(p) {
  const av = p.avatar_url
    ? `<img src="${p.avatar_url}" alt="">`
    : initials(p.display_name);
  const flag = flagEmoji(p.country_code);
  return `
    <div class="post" data-uid="${p.user_id || ''}">
      <div class="post-head">
        <div class="post-avatar">${av}</div>
        <div>
          <span class="post-author">${p.display_name || 'Reader'}</span>
          ${flag ? '<span class="post-time"> · '+flag+'</span>' : ''}
          ${p.topic ? '<span class="post-topic">'+p.topic+'</span>' : ''}
          <div class="post-time">${timeAgo(p.created_at)}</div>
        </div>
      </div>
      <div class="post-body">${escapeHtml(p.body || '')}</div>
    </div>`;
}

function renderMember(m) {
  const isMe = m.id && m.id === currentUserId;
  const flag = flagEmoji(m.country_code);
  const inner = m.avatar_url
    ? `<img src="${m.avatar_url}" alt="${m.display_name || 'Reader'}">`
    : initials(m.display_name);
  return `
    <div class="member">
      <div class="member-av ${isMe ? 'me' : ''}" ${isMe ? `id="myMemberAvatar" onclick="document.getElementById('memberAvatarInput').click()" title="Add your photo"` : ''}>
        <div class="member-avatar">${inner}</div>
        ${flag ? `<span class="member-flag">${flag}</span>` : ''}
        ${isMe ? `<div class="member-veil"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.4-2h7.2L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></div>` : ''}
      </div>
      <div class="member-name">${m.display_name || 'Reader'}${isMe ? '<span class="member-you">you</span>' : ''}</div>
      ${m.role === 'owner' ? '<span class="member-role">Owner</span>' : ''}
    </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Join ──
async function handleJoin() {
  if (!API.isLoggedIn()) return API.openSignInModal();
  const btn = document.getElementById('joinBtn');
  if (isMember) return;
  btn.disabled = true;
  btn.textContent = 'Joining…';
  try {
    await API.post('/api/clubs/' + clubId + '/join');
    isMember = true;
    btn.textContent = '✓ Member';
    // Enable posting
    const input = document.getElementById('postInput');
    const submit = document.getElementById('postSubmit');
    if (input)  { input.disabled = false; input.placeholder = 'Share a thought with the club…'; }
    if (submit) submit.disabled = false;
    toast('Welcome to ' + clubData.name + '! 👥');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Join this club';
    toast(e.message || 'Could not join', 'error');
  }
}

// ── Post ──
async function submitPost() {
  if (!API.isLoggedIn()) return API.openSignInModal();
  const input = document.getElementById('postInput');
  const body = input.value.trim();
  if (!body) return toast('Write something first', 'error');

  const submit = document.getElementById('postSubmit');
  submit.disabled = true;
  submit.textContent = 'Posting…';

  try {
    const res = await API.post('/api/clubs/' + clubId + '/posts', { body });
    const post = res.post;
    // Prepend to feed
    const feed = document.getElementById('postFeed');
    const empty = feed.querySelector('.empty');
    if (empty) feed.innerHTML = '';
    // Add display name from session
    const session = API.getSession();
    post.display_name = session?.user?.display_name || 'You';
    post.country_code = session?.user?.country_code || '';
    post.avatar_url   = myAvatarUrl || null;
    post.user_id      = currentUserId || session?.user?.id || '';
    feed.insertAdjacentHTML('afterbegin', renderPost(post));
    input.value = '';
    toast('Posted ✦');
  } catch (e) {
    toast(e.message || 'Could not post', 'error');
  } finally {
    submit.disabled = false;
    submit.textContent = 'Post →';
  }
}

// ── Share ──
function shareClub() {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Club link copied ✦')).catch(() => toast('Club link: ' + url));
  } else {
    toast('Club link: ' + url);
  }
}

// ── Upload club image ──
const CLOUDINARY_CLOUD = 'daxtv3avw';
const CLOUDINARY_PRESET = 'globalbookshelf_books';

async function uploadClubImage(input) {
  const file = input.files[0];
  if (!file) return;

  const wrap   = document.getElementById('clubAvatarWrap');
  const banner = document.getElementById('clubBanner');
  if (wrap) { wrap.classList.add('uploading'); wrap.classList.remove('empty'); }

  try {
    // Upload to Cloudinary
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: form
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Upload failed');
    const imageUrl = data.secure_url;

    // Save to the club record
    await API.patch('/api/clubs/' + clubId + '/image', { image_url: imageUrl });

    // Update the banner live
    if (banner) {
      banner.style.background = `url('${imageUrl}') center/cover no-repeat`;
      const emojiEl = banner.querySelector('.club-banner-emoji');
      if (emojiEl) emojiEl.remove();
    }

    // Update the avatar live (keep the hover veil)
    const avatarEl = document.getElementById('clubAvatar');
    if (avatarEl) {
      const veil = avatarEl.querySelector('.avatar-veil');
      avatarEl.innerHTML = `<img src="${imageUrl}" alt="club image">`;
      if (veil) {
        const label = veil.querySelector('span');
        if (label) label.textContent = 'Change';
        avatarEl.appendChild(veil);
      }
    }

    if (wrap) wrap.classList.remove('uploading');
    input.value = '';
    toast('Club image updated ✦');
  } catch (e) {
    if (wrap) {
      wrap.classList.remove('uploading');
      if (!document.getElementById('clubAvatar')?.querySelector('img')) wrap.classList.add('empty');
    }
    input.value = '';
    toast(e.message || 'Could not upload image', 'error');
  }
}

// ── Member takes their seat: upload own profile photo (used across every club & post) ──
async function uploadMemberAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  if (!API.isLoggedIn()) { API.openSignInModal(); return; }

  const av = document.getElementById('myMemberAvatar');
  if (av) av.classList.add('uploading');

  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method:'POST', body:form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Upload failed');
    const imageUrl = data.secure_url;

    // Save to my user record — this photo now follows me everywhere
    await API.patch('/api/me/avatar', { avatar_url: imageUrl });
    myAvatarUrl = imageUrl;

    // Update my face in the member list
    if (av) {
      const veil = av.querySelector('.member-veil');
      const box  = av.querySelector('.member-avatar');
      if (box) box.innerHTML = `<img src="${imageUrl}" alt="you">`;
      if (veil) av.appendChild(veil);
      av.classList.remove('uploading');
    }

    // Update my face on every post I've written in this thread
    if (currentUserId) {
      document.querySelectorAll(`.post[data-uid="${currentUserId}"] .post-avatar`).forEach(el => {
        el.innerHTML = `<img src="${imageUrl}" alt="">`;
      });
    }

    input.value = '';
    toast('You\u2019ve taken your seat \u2726 readers everywhere will see your face');
  } catch (e) {
    if (av) av.classList.remove('uploading');
    input.value = '';
    toast(e.message || 'Could not upload your photo', 'error');
  }
}

// ── Toast ──
function toast(msg, type) {
  if (API && API.toast) return API.toast(msg, type);
  const t = document.createElement('div');
  t.className = 'gbs-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

loadClub();
</script>

<script>
/* GBS-CHIPS-SLIDE */
(function(){
  function init(){
    var strip = document.querySelector('.filter-strip');
    if (!strip) return;

    var tab = document.createElement('button');
    tab.className = 'chips-tab';
    tab.type = 'button';
    tab.setAttribute('aria-label','Show genre filters');
    tab.textContent = 'Genres';
    document.body.appendChild(tab);

    var lastY = window.pageYOffset || 0;
    var hidden = false;
    var ticking = false;

    function isMobile(){ return window.matchMedia('(max-width: 900px)').matches; }

    function setHidden(v){
      if (v === hidden) return;
      hidden = v;
      strip.classList.toggle('chips-hidden', v);
      tab.classList.toggle('show', v && isMobile());
    }

    function onScroll(){
      if (!isMobile()) { setHidden(false); return; }
      var y = window.pageYOffset || 0;
      if (y < 40) { setHidden(false); }
      else if (y > lastY + 6) { setHidden(true); }   // scrolling down -> get out of the way
      else if (y < lastY - 6) { setHidden(false); }  // scrolling up   -> come back
      lastY = y;
      ticking = false;
    }

    window.addEventListener('scroll', function(){
      if (!ticking) { ticking = true; window.requestAnimationFrame(onScroll); }
    }, { passive: true });

    tab.addEventListener('click', function(){ setHidden(false); });

    window.addEventListener('resize', function(){
      if (!isMobile()) setHidden(false);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

<script>
/* GBS-CHIPS-HERO-ONLY */
(function(){
  function init(){
    var strip = document.querySelector('.filter-strip');
    if (!strip) return;
    var hero = document.querySelector('.hero') || document.querySelector('#map-container');
    var tab  = document.querySelector('.chips-tab');

    function isMobile(){ return window.matchMedia('(max-width: 900px)').matches; }

    function update(){
      if (!isMobile()){
        strip.classList.remove('chips-off');
        if (tab) tab.classList.remove('chips-off');
        return;
      }
      // hide once the hero has scrolled out of view
      var limit = hero ? hero.offsetHeight - 120 : window.innerHeight - 120;
      var past  = (window.pageYOffset || 0) > limit;
      strip.classList.toggle('chips-off', past);
      if (tab) tab.classList.toggle('chips-off', past);
    }

    var ticking = false;
    window.addEventListener('scroll', function(){
      if (!ticking){
        ticking = true;
        window.requestAnimationFrame(function(){ update(); ticking = false; });
      }
    }, { passive: true });

    window.addEventListener('resize', update);
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
